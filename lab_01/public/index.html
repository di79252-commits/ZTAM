<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#164e63">
    <meta name="description" content="Moja aplikacja PWA działająca online i offline">
    <title>Moja aplikacja PWA</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    <script src="index.js" defer=""></script>
    <link rel="icon" type="image/png" sizes="196x196" href="icons/favicon-196.png">
    <link rel="apple-touch-icon" href="icons/apple-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
  </head>
  <body>
    <main>
      <h1>Moja aplikacja PWA</h1>
      <p>Aplikacja internetowa z możliwością instalacji i pracy offline.</p>
      <button class="install-button" type="button" hidden="">
        Zainstaluj aplikację
      </button>
      <p id="status" role="status">Aplikacja została uruchomiona.</p>
    </main>
  </body>
</html>
